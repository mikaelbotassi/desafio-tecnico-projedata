<mat-card class="user-card" appearance="outlined">
  <mat-card-header>
    <div class="avatar" aria-hidden="true">{{ initials() }}</div>

    <div class="user-card__heading">
      <mat-card-title>{{ user().name }}</mat-card-title>
      <mat-card-subtitle>{{ user().email }}</mat-card-subtitle>
    </div>
  </mat-card-header>

  <mat-card-content>
    <dl class="user-details">
      <div>
        <dt>CPF</dt>
        <dd>{{ user().cpf | mask: '000.000.000-00' }}</dd>
      </div>

      <div>
        <dt>{{ phoneTypeLabel() }}</dt>
        <dd>{{ user().phone | mask: phoneMask() }}</dd>
      </div>
    </dl>
  </mat-card-content>

  <mat-card-actions align="end">
    <button
      mat-button
      type="button"
      [attr.aria-label]="'Editar usuário ' + user().name"
      (click)="requestEdit()"
    >
      <mat-icon>edit</mat-icon>
      Editar
    </button>
  </mat-card-actions>
</mat-card>
